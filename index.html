<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser</title>
    <script>
      // THEME BEFORE FIRST PAINT. An iframe has its own <html>, so the host's data-theme does not
      // reach it; the host puts the value in the URL so the page can apply it before it renders
      // anything. Doing this in Svelte would flash light in dark mode for the length of a module load.
      (() => {
        const q = new URLSearchParams(location.search).get('theme')
        const dark = q === 'dark' || (q !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
